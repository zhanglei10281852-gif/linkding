rubrics:
  - id: 1
    type: p2p
    text: 没有并发变更时，full_backup 保持既有命令参数、ZIP 内路径和 SQLite 恢复兼容性，固定版本生成的旧格式备份仍可使用。
  - id: 2
    type: f2p
    text: 备份期间并发上传或后台生成资产时，最终归档中的数据库引用和 assets、favicons、previews 成员属于同一视图，不出现只在一侧可见的变更。
  - id: 3
    type: f2p
    text: 备份期间删除文件及其数据库引用时，删除完整落在快照边界的一侧，恢复结果不存在悬空引用或无主归档成员。
  - id: 4
    type: f2p
    text: 数据库复制、文件读取、校验或最终发布失败时不暴露半成品、不覆盖已有有效备份，并释放协调状态且清除本次临时资源。
  - id: 5
    type: f2p
    text: 新备份携带覆盖数据库和所有归档成员的确定性清单与内容摘要，自校验能拒绝缺失、额外或被篡改的成员。
  - id: 6
    type: f2p
    text: 一次失败完成清理后，生产写入可以继续，随后重新执行备份能够发布一个完整归档而不复用失败运行的残留状态。
  - id: 7
    type: p2p
    text: 书签上传、删除及后台图标、预览和快照任务在未执行备份时保持现有成功行为、权限和文件布局。

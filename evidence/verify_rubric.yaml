rubrics:
  - id: 1
    type: f2p
    text: REST POST 在合法且已占用的位置创建书签包时会插入并平移该用户后续记录，结果 order 恰为从 0 到 n-1 的唯一序列。
  - id: 2
    type: f2p
    text: REST PUT、PATCH 与网页拖动使用同一移动语义调整全部受影响兄弟项，不产生重复、负数或空洞。
  - id: 3
    type: f2p
    text: 同一用户的并发创建和移动只形成某个完整串行顺序，事务失败不暴露半次平移或复制对象，其他用户的记录和值不受影响。
  - id: 4
    type: f2p
    text: 升级按原 order、date_created、id 的稳定次序修复已有负数、重复和空洞，并由每用户唯一及非负的持久约束阻止非法值再次提交。
  - id: 5
    type: f2p
    text: 创建位置不在 0 到 n 或移动位置不在 0 到 n-1 时返回 400 且不修改任何书签包，事务冲突后的重试仍保持单一稠密顺序。
  - id: 6
    type: p2p
    text: REST 创建未提供 order 时仍追加到末尾，现有筛选字段、权限、响应字段和按 order 列表排序保持不变。
  - id: 7
    type: p2p
    text: 网页与 REST 删除继续收紧剩余顺序，跨用户访问仍被拒绝，网页创建、编辑后的既有跳转和消息行为不回归。
